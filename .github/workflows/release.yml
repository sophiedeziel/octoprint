name: Release

# Publishes the gem to rubygems.org when a GitHub Release is published for a
# `vX.Y.Z` tag, through RubyGems trusted publishing (OIDC): no API key is stored
# in the repo. See the "Releasing" section of the README.

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: [ lint, tests ]
    runs-on: ubuntu-latest
    # Must match the environment set on the rubygems.org trusted publisher.
    environment: rubygems
    permissions:
      id-token: write # OIDC token for trusted publishing
      contents: write # update the GitHub Release notes and attach the gem

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby and gems
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        bundler-cache: true # Ruby version from .tool-versions

    - name: Check tag matches Octoprint::VERSION
      run: |
        version="$(ruby -r ./lib/octoprint/version -e 'print Octoprint::VERSION')"
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match Octoprint::VERSION ${version}"
          exit 1
        fi

    # Done before publishing so a missing CHANGELOG section stops the release
    # before anything reaches rubygems.org.
    - name: Extract release notes from CHANGELOG
      run: |
        awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0; next} /^\[[^]]+\]: /{p = 0} p' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
        grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md" || { echo "::error::No CHANGELOG section for ${GITHUB_REF_NAME}"; exit 1; }

    # Trusted publishing can only create a new gem when the exchange names the
    # rubygems.org account that will own it (`owner`). No release of
    # rubygems/release-gem or configure-rubygems-credentials sends it yet, so
    # this step exchanges the GitHub OIDC token itself.
    - name: Get a rubygems.org API key through trusted publishing
      env:
        RUBYGEMS_OWNER_ID: ${{ vars.RUBYGEMS_OWNER_ID }}
      run: |
        if [ -z "${RUBYGEMS_OWNER_ID}" ]; then
          echo "::error::Set the RUBYGEMS_OWNER_ID repository variable to the rubygems.org account ID that owns the gem"
          exit 1
        fi
        jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)"
        echo "::add-mask::${jwt}"
        jq -n --arg jwt "${jwt}" --arg owner "${RUBYGEMS_OWNER_ID}" '{jwt: $jwt, owner: $owner}' > "${RUNNER_TEMP}/exchange.json"
        status="$(curl -sS -o "${RUNNER_TEMP}/key.json" -w '%{http_code}' -X POST \
          -H 'content-type: application/json' -H 'accept: application/json' \
          --data @"${RUNNER_TEMP}/exchange.json" \
          https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)"
        rm -f "${RUNNER_TEMP}/exchange.json"
        if [ "${status}" != "201" ]; then
          echo "::error::Trusted publishing token exchange failed (HTTP ${status})"
          cat "${RUNNER_TEMP}/key.json"
          exit 1
        fi
        key="$(jq -r .rubygems_api_key "${RUNNER_TEMP}/key.json")"
        rm -f "${RUNNER_TEMP}/key.json"
        echo "::add-mask::${key}"
        echo "GEM_HOST_API_KEY=${key}" >> "${GITHUB_ENV}"

    # Runs `bundle exec rake release`, which pushes with GEM_HOST_API_KEY from
    # the step above. The tag already exists, so Bundler skips its git push
    # and only builds and pushes the gem.
    - name: Publish to rubygems.org
      uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      with:
        setup-trusted-publisher: false

    # The CHANGELOG is the source of truth: it replaces the notes typed in the
    # GitHub UI.
    - name: Update GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release edit "$GITHUB_REF_NAME" --notes-file "${RUNNER_TEMP}/notes.md"
        gh release upload "$GITHUB_REF_NAME" pkg/*.gem

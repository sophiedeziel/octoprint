name: Tests

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  # Reused by release.yml so a tag must pass the same checks before publishing.
  workflow_call:

jobs:
  RSpec:
    runs-on: ubuntu-latest

##
# latest info: https://endoflife.date/ruby
#
# Keep this matrix in sync with `required_ruby_version` in octoprint.gemspec
# and `TargetRubyVersion` in .rubocop.yml. When a version reaches EOL, drop it
# from all three.
#
# Ruby 4.0
# status: normal maintenance
# release date: 2025-12-25
# EOL: 2029-03-31 (expected)

# Ruby 3.4
# status: normal maintenance
# release date: 2024-12-25
# EOL: 2028-03-31 (expected)

# Ruby 3.3
# status: normal maintenance
# release date: 2023-12-25
# EOL: 2027-03-31 (expected)

    strategy:
      matrix:
        ruby:
          - 4.0
          - 3.4
          - 3.3

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Ruby and gems
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the default task
      run: bundle exec rspec --format RSpec::Github::Formatter --format documentation

  # Builds the gem and loads it outside Bundler, with only its declared runtime
  # dependencies installed. Fails if lib/ requires a dev-only gem (e.g. pry).
  Gem-Smoke:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby:
          - 4.0
          - 3.4
          - 3.3

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Ruby
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: false

    - name: Build, install into a clean GEM_HOME, and require
      run: |
        gem build octoprint.gemspec
        export GEM_HOME="$(mktemp -d)" GEM_PATH="$GEM_HOME"
        gem install --no-document ./octoprint-*.gem
        ruby -e 'require "octoprint"; Zeitwerk::Loader.eager_load_all; puts Octoprint::VERSION'
